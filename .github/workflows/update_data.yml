name: Update Quidwatch data

on:
  schedule:
    # 07:00 UTC every Monday. BoE effective rates publish monthly (21st
    # working day) and ONS CPI publishes monthly too, so weekly is more
    # than often enough - this just means "check for updates weekly".
    - cron: "0 7 * * 1"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: .
        run: python src/run_pipeline.py

      - name: Commit updated data files
        run: |
          git config user.name "quidwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/processed
          git diff --staged --quiet || git commit -m "Automated data refresh"
          git push
